<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" width="60" height="30" role="img" aria-label="IA">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#050505"/>
      <stop offset="0.5" stop-color="#141414"/>
      <stop offset="1"   stop-color="#0a0a0a"/>
    </linearGradient>
    <!-- Oro del destello: de champán a oro profundo -->
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#f6e27a"/>
      <stop offset="0.5" stop-color="#d4af37"/>
      <stop offset="1"   stop-color="#a8842c"/>
    </linearGradient>
    <!-- Nebulosa dorada muy sutil -->
    <radialGradient id="brilloOro" cx="0.3" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="recorte"><rect width="60" height="30" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#recorte)">
    <rect width="60" height="30" fill="url(#bg)"/>
    <rect width="60" height="30" fill="url(#brilloOro)"/>

    <!-- Estrellas: blancas + toques dorados -->
    <circle cx="8"  cy="6"  r="0.7" fill="#ffffff" opacity="0.7"/>
    <circle cx="26" cy="25" r="0.5" fill="#cfcfcf" opacity="0.45"/>
    <circle cx="44" cy="6"  r="0.7" fill="#ffffff" opacity="0.8"/>
    <circle cx="52" cy="20" r="0.5" fill="#e0e0e0" opacity="0.5"/>
    <circle cx="50" cy="8"  r="0.6" fill="#d4af37" opacity="0.7"/>
    <circle cx="14" cy="24" r="0.5" fill="#d4af37" opacity="0.55"/>
  </g>

  <!-- Borde dorado apagado -->
  <rect x="0.5" y="0.5" width="59" height="29" rx="6" fill="none" stroke="#5d4b1d"/>

  <!-- Destello IA (✦) -->
  <g transform="translate(17,15)">
    <path d="M0 -6.5 C0.8 -2.2, 2.2 -0.8, 6.5 0 C2.2 0.8, 0.8 2.2, 0 6.5 C-0.8 2.2, -2.2 0.8, -6.5 0 C-2.2 -0.8, -0.8 -2.2, 0 -6.5 Z"
          fill="url(#oro)"/>
    <!-- Destello pequeño acompañante -->
    <path d="M0 -6.5 C0.8 -2.2, 2.2 -0.8, 6.5 0 C2.2 0.8, 0.8 2.2, 0 6.5 C-0.8 2.2, -2.2 0.8, -6.5 0 C-2.2 -0.8, -0.8 -2.2, 0 -6.5 Z"
          transform="translate(7.5,-6.5) scale(0.42)" fill="url(#oro)" opacity="0.85"/>
  </g>

  <!-- Texto -->
  <text x="31" y="19.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="11.5" font-weight="600" letter-spacing="2" fill="#f2f2f2">IA</text>
</svg>