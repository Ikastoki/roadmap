<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 30" width="90" height="30" role="img" aria-label="Inicio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.5" stop-color="#161616"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.25" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.85" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#8a8a8a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8a8a8a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect width="90" height="30" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="90" height="30" fill="url(#bg)"/>
    <rect width="90" height="30" fill="url(#neb1)"/>
    <rect width="90" height="30" fill="url(#neb2)"/>
    <circle cx="12" cy="7" r="0.7" fill="#fff" opacity="0.7"/>
    <circle cx="30" cy="24" r="0.5" fill="#cfcfcf" opacity="0.5"/>
    <circle cx="55" cy="6" r="0.8" fill="#fff" opacity="0.8"/>
    <circle cx="75" cy="23" r="0.5" fill="#bdbdbd" opacity="0.5"/>
    <circle cx="42" cy="15" r="0.4" fill="#d4af37" opacity="0.6"/>
  </g>

  <!-- Borde dorado apagado (estático) -->
  <rect x="0.5" y="0.5" width="89" height="29" rx="6" fill="none" stroke="#5d4b1d"/>

  <!-- Casa dorada -->
  <g fill="none" stroke="#d4af37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 15 L16 9 L23 15"/>
    <path d="M11 14 V21 H21 V14"/>
    <path d="M15 21 V17 H17 V21"/>
  </g>

  <!-- Texto dorado -->
  <text x="30" y="19.5" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="1.2" fill="#d4af37">INICIO</text>
</svg>