<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 106 30" width="106" height="30" role="img" aria-label="código">
  <defs>
    <!-- Fondo degradado oscuro -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#050505"/>
      <stop offset="0.5" stop-color="#161616"/>
      <stop offset="1"   stop-color="#0a0a0a"/>
    </linearGradient>
    <!-- "Nebulosas" sutiles en escala de grises -->
    <radialGradient id="nebulosa1" cx="0.25" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulosa2" cx="0.85" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#8a8a8a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#8a8a8a" stop-opacity="0"/>
    </radialGradient>
    <!-- Plateado metálico para el snake -->
    <linearGradient id="plata" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c8d0d8"/>
      <stop offset="1"   stop-color="#8a949e"/>
    </linearGradient>
    <clipPath id="recorte"><rect width="106" height="30" rx="6"/></clipPath>
    <!-- Blur para el glow del snake -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <style>
    @keyframes snake {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -258; }
    }
    .snake-glow, .snake-line {
      stroke-dasharray: 40 218;
      animation: snake 4s linear infinite;
    }
  </style>

  <g clip-path="url(#recorte)">
    <rect width="106" height="30" fill="url(#bg)"/>
    <rect width="106" height="30" fill="url(#nebulosa1)"/>
    <rect width="106" height="30" fill="url(#nebulosa2)"/>

    <!-- Campo de estrellas sutil (blancos y grises) -->
    <circle cx="12"  cy="6"  r="0.7" fill="#ffffff" opacity="0.8"/>
    <circle cx="26"  cy="24" r="0.5" fill="#cfcfcf" opacity="0.5"/>
    <circle cx="44"  cy="5"  r="0.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="58"  cy="23" r="0.5" fill="#bdbdbd" opacity="0.5"/>
    <circle cx="72"  cy="7"  r="0.7" fill="#ffffff" opacity="0.7"/>
    <circle cx="88"  cy="20" r="0.6" fill="#e0e0e0" opacity="0.6"/>
    <circle cx="100" cy="6"  r="0.7" fill="#ffffff" opacity="0.8"/>
    <circle cx="66"  cy="14" r="0.4" fill="#ffffff" opacity="0.4"/>
    <circle cx="96"  cy="12" r="0.4" fill="#9e9e9e" opacity="0.5"/>
    <circle cx="34"  cy="12" r="0.4" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Borde base gris (se mantiene) -->
  <rect x="0.5" y="0.5" width="105" height="29" rx="6" fill="none" stroke="#3d3d3d"/>

  <!-- Snake border: glow + línea nítida -->
  <rect class="snake-glow" x="0.5" y="0.5" width="105" height="29" rx="6"
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.45"
        filter="url(#glow)"/>
  <rect class="snake-line" x="0.5" y="0.5" width="105" height="29" rx="6"
        fill="none" stroke="url(#plata)" stroke-width="1.2"
        stroke-linecap="round"/>

  <!-- Icono de código </> en vectorial -->
  <g fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 10.5 L10.5 15 L15 19.5"/>
    <path d="M25 10.5 L29.5 15 L25 19.5"/>
    <path d="M21.8 8.5 L18.2 21.5"/>
  </g>

  <!-- Texto -->
  <text x="38" y="19.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#f2f2f2">CÓDIGO</text>
</svg>