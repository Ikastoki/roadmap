<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 30" width="124" height="30" role="img" aria-label="soft skills">
  <defs>
    <!-- Cielo nocturno suave -->
    <linearGradient id="cieloNoche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#090d1c"/>
      <stop offset="0.6" stop-color="#101731"/>
      <stop offset="1"   stop-color="#0b1022"/>
    </linearGradient>
    <!-- Brillo cálido sutil -->
    <radialGradient id="brilloCalido" cx="0.15" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f3e3ae" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f3e3ae" stop-opacity="0"/>
    </radialGradient>
    <!-- Nebulosa azulada -->
    <radialGradient id="nebulosa" cx="0.8" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#4a5aa8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4a5aa8" stop-opacity="0"/>
    </radialGradient>
    <filter id="suave" x="-20%" y="-20%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <clipPath id="recorte"><rect width="124" height="30" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#recorte)">
    <rect width="124" height="30" fill="url(#cieloNoche)"/>
    <rect width="124" height="30" fill="url(#brilloCalido)"/>
    <rect width="124" height="30" fill="url(#nebulosa)"/>

    <!-- Estrellas (blancas + doradas, como el set) -->
    <circle cx="44"  cy="6"  r="0.7" fill="#ffffff" opacity="0.8"/>
    <circle cx="58"  cy="24" r="0.5" fill="#cfcfcf" opacity="0.5"/>
    <circle cx="70"  cy="5"  r="0.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="84"  cy="22" r="0.6" fill="#e0e0e0" opacity="0.6"/>
    <circle cx="98"  cy="10" r="0.7" fill="#ffffff" opacity="0.8"/>
    <circle cx="50"  cy="12" r="0.4" fill="#ffffff" opacity="0.5"/>
    <circle cx="110" cy="20" r="0.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="76"  cy="25" r="0.6" fill="#d4af37" opacity="0.7"/>
    <circle cx="104" cy="6"  r="0.6" fill="#d4af37" opacity="0.7"/>

    <!-- Nubes esponjosas nocturnas -->
    <g filter="url(#suave)">
      <circle cx="10" cy="30"   r="6"   fill="#262e48"/>
      <circle cx="18" cy="26.5" r="7.5" fill="#262e48"/>
      <circle cx="27" cy="28.5" r="6.5" fill="#262e48"/>
      <circle cx="33" cy="31"   r="5"   fill="#262e48"/>
      <circle cx="18" cy="24"   r="4"   fill="#3d4768"/>
      <circle cx="27" cy="26.5" r="3.5" fill="#3d4768"/>
    </g>
    <g filter="url(#suave)">
      <circle cx="94"  cy="31" r="5.5" fill="#262e48"/>
      <circle cx="102" cy="27" r="7"   fill="#262e48"/>
      <circle cx="111" cy="29" r="6"   fill="#262e48"/>
      <circle cx="118" cy="31" r="5"   fill="#262e48"/>
      <circle cx="102" cy="24.5" r="4"   fill="#3d4768"/>
      <circle cx="111" cy="27"   r="3.2" fill="#3d4768"/>
    </g>
    <g filter="url(#suave)" opacity="0.9">
      <circle cx="28" cy="3" r="3.5" fill="#232a42"/>
      <circle cx="34" cy="2" r="4"   fill="#232a42"/>
      <circle cx="40" cy="3" r="3.5" fill="#232a42"/>
      <circle cx="34" cy="1" r="2.2" fill="#3d4768"/>
    </g>
    <g filter="url(#suave)" opacity="0.9">
      <circle cx="97"  cy="3" r="3.5" fill="#232a42"/>
      <circle cx="103" cy="2" r="4"   fill="#232a42"/>
      <circle cx="109" cy="3" r="3.5" fill="#232a42"/>
      <circle cx="103" cy="1" r="2.2" fill="#3d4768"/>
    </g>

    <!-- Texto centrado -->
    <text x="62" y="19.5" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="11.5" font-weight="600" letter-spacing="1" fill="#e8ecf7">SOFT SKILLS</text>
  </g>

  <!-- Borde dorado apagado, mismo radio que el set -->
  <rect x="0.5" y="0.5" width="123" height="29" rx="6" fill="none" stroke="#5d4b1d"/>
</svg>